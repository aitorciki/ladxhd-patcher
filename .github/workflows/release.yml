name: Release
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Nightly Build' ||
    inputs.trigger == 'nightly' && 'Nightly Build' ||
    inputs.trigger == 'release' && (inputs.upstream_tag && format('Release {0}', inputs.upstream_tag) || 'Release Build') ||
    'Manual Build'
  }}

concurrency:
  group: >-
    release-${{
      github.event_name == 'schedule' && 'nightly' ||
      inputs.trigger == 'nightly' && 'nightly' ||
      inputs.trigger == 'release' && format('release-{0}', inputs.upstream_tag) ||
      github.run_id
    }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: "Trigger type"
        required: true
        default: "manual"
        type: choice
        options:
          - manual
          - release
          - nightly
      upstream_tag:
        description: "Upstream tag (for release trigger only)"
        required: false
  schedule:
    - cron: "0 5 * * *"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
  AWS_DEFAULT_REGION: auto
  R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
  ASSET_ENCRYPTION_KEY: ${{ secrets.ASSET_ENCRYPTION_KEY }}
  RUN_ID: ${{ github.run_id }}

jobs:
  game:
    uses: ./.github/workflows/build-game.yml
    secrets: inherit
    with:
      game_ref: ${{ inputs.upstream_tag }}

  launcher:
    uses: ./.github/workflows/build-launcher.yml
    secrets: inherit
    with:
      game_ref: ${{ inputs.upstream_tag }}

  finalize-windows:
    needs: [game, launcher]
    runs-on: windows-latest
    steps:
      - name: Checkout ladxhd-patcher
        uses: actions/checkout@v6

      - name: Download artifacts from R2
        shell: bash
        run: |
          scripts/r2-download.sh \
            windows-dx11.tar.gz windows-dx12.tar.gz windows-gl.tar.gz windows-vk.tar.gz launcher-windows.tar.gz

      - name: Finalize Windows
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files/7-Zip"
          scripts/finalize-windows.sh windows-dx11
          scripts/finalize-windows.sh windows-dx12
          scripts/finalize-windows.sh windows-gl
          scripts/finalize-windows.sh windows-vk

      - name: Upload final packages to R2
        shell: bash
        run: scripts/r2-upload.sh final-windows-dx11.zip final-windows-dx12.zip final-windows-gl.zip final-windows-vk.zip

  finalize-linux-standalone:
    needs: [game, launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ladxhd-patcher
        uses: actions/checkout@v6

      - name: Download artifacts from R2
        shell: bash
        run: |
          scripts/r2-download.sh \
            linux-x64-gl.tar.gz linux-arm64-gl.tar.gz linux-x64-vk.tar.gz linux-arm64-vk.tar.gz \
            launcher-linux-x64.tar.gz launcher-linux-arm64.tar.gz

      - name: Finalize Linux Standalone
        shell: bash
        run: |
          scripts/finalize-linux-standalone.sh linux-x64-gl
          scripts/finalize-linux-standalone.sh linux-arm64-gl
          scripts/finalize-linux-standalone.sh linux-x64-vk
          scripts/finalize-linux-standalone.sh linux-arm64-vk

      - name: Upload final packages to R2
        shell: bash
        run: scripts/r2-upload.sh final-linux-x64-gl-standalone.zip final-linux-arm64-gl-standalone.zip final-linux-x64-vk-standalone.zip final-linux-arm64-vk-standalone.zip

  finalize-linux-appimage:
    needs: [game, launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ladxhd-patcher
        uses: actions/checkout@v6

      - name: Checkout bighead.0/ladxhd_updated
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "${{ inputs.upstream_tag || 'main' }}" \
            https://gitlab.com/bighead.0/ladxhd_updated.git game
          git -C game sparse-checkout set icon

      - name: Download artifacts from R2
        shell: bash
        run: |
          scripts/r2-download.sh \
            linux-x64-gl.tar.gz linux-arm64-gl.tar.gz linux-x64-vk.tar.gz linux-arm64-vk.tar.gz \
            launcher-linux-x64.tar.gz launcher-linux-arm64.tar.gz

      - name: Finalize Linux AppImage
        shell: bash
        env:
          ICON_SVG: game/icon/Icon.svg
          ICON_PNG: game/icon/linux/Icon.png
        run: |
          scripts/finalize-linux-appimage.sh linux-x64-gl
          scripts/finalize-linux-appimage.sh linux-arm64-gl
          scripts/finalize-linux-appimage.sh linux-x64-vk
          scripts/finalize-linux-appimage.sh linux-arm64-vk

      - name: Upload final packages to R2
        shell: bash
        run: scripts/r2-upload.sh final-linux-x64-gl-appimage.zip final-linux-arm64-gl-appimage.zip final-linux-x64-vk-appimage.zip final-linux-arm64-vk-appimage.zip

  finalize-macos:
    needs: [game, launcher]
    runs-on: macos-latest
    steps:
      - name: Checkout ladxhd-patcher
        uses: actions/checkout@v6

      - name: Checkout bighead.0/ladxhd_updated
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "${{ inputs.upstream_tag || 'main' }}" \
            https://gitlab.com/bighead.0/ladxhd_updated.git game
          git -C game sparse-checkout set --no-cone --stdin <<'EOF'
          /icon/macos/
          /Directory.Build.props
          EOF

      - name: Read game version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*<GameVersion>\(.*\)<\/GameVersion>.*/\1/p' game/Directory.Build.props)
          echo "GAME_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download artifacts from R2
        shell: bash
        run: |
          scripts/r2-download.sh \
            macos-arm64-gl.tar.gz macos-x64-gl.tar.gz macos-arm64-vk.tar.gz macos-x64-vk.tar.gz \
            launcher-macos-arm64.tar.gz launcher-macos-x64.tar.gz

      - name: Finalize macOS
        shell: bash
        env:
          ICON_SRC: game/icon/macos/Icon.icns
        run: |
          scripts/finalize-macos.sh macos-arm64-gl
          scripts/finalize-macos.sh macos-x64-gl
          scripts/finalize-macos.sh macos-arm64-vk
          scripts/finalize-macos.sh macos-x64-vk

      - name: Upload final packages to R2
        shell: bash
        run: |
          scripts/r2-upload.sh \
            final-macos-arm64-gl-game.zip final-macos-arm64-gl-launcher.zip \
            final-macos-x64-gl-game.zip final-macos-x64-gl-launcher.zip \
            final-macos-arm64-vk-game.zip final-macos-arm64-vk-launcher.zip \
            final-macos-x64-vk-game.zip final-macos-x64-vk-launcher.zip

  finalize-android:
    needs: [game]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ladxhd-patcher
        uses: actions/checkout@v6

      - name: Download artifacts from R2
        shell: bash
        run: scripts/r2-download.sh android.tar.gz

      - name: Finalize Android
        shell: bash
        run: scripts/finalize-android.sh

      - name: Upload final package to R2
        shell: bash
        run: scripts/r2-upload.sh final-android.zip

  generate-patches:
    needs:
      [
        finalize-windows,
        finalize-linux-standalone,
        finalize-linux-appimage,
        finalize-macos,
        finalize-android,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ladxhd-patcher
        uses: actions/checkout@v6

      - name: Install xdelta3
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xdelta3

      - name: Download v1.0.0 archive
        shell: bash
        run: curl -fL --retry 3 --retry-all-errors --retry-delay 5 "${{ secrets.V1_URL }}" -o v1.zip

      - name: Download finalized packages from R2
        shell: bash
        run: |
          scripts/r2-download.sh \
            final-windows-dx11.zip final-windows-dx12.zip final-windows-gl.zip final-windows-vk.zip \
            final-linux-x64-gl-standalone.zip final-linux-arm64-gl-standalone.zip final-linux-x64-vk-standalone.zip final-linux-arm64-vk-standalone.zip \
            final-linux-x64-gl-appimage.zip final-linux-arm64-gl-appimage.zip final-linux-x64-vk-appimage.zip final-linux-arm64-vk-appimage.zip \
            final-macos-arm64-gl-game.zip final-macos-x64-gl-game.zip \
            final-macos-arm64-gl-launcher.zip final-macos-x64-gl-launcher.zip \
            final-macos-arm64-vk-game.zip final-macos-x64-vk-game.zip \
            final-macos-arm64-vk-launcher.zip final-macos-x64-vk-launcher.zip \
            final-android.zip

      - name: Compute release metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.trigger }}" = "nightly" ]; then
            {
              echo "RELEASE_TAG=nightly"
              echo "RELEASE_SUFFIX=nightly-$(date -u +%Y%m%d)"
              echo "RELEASE_TITLE=Nightly ($(date -u +%Y%m%d))"
              echo "RELEASE_NOTES=Automated build from run ${{ github.run_id }}"
              echo "IS_NIGHTLY=true"
            } >> "$GITHUB_ENV"
          elif [ "${{ inputs.trigger }}" = "release" ]; then
            {
              echo "RELEASE_TAG=${{ inputs.upstream_tag }}"
              echo "RELEASE_SUFFIX=${{ inputs.upstream_tag }}"
              echo "RELEASE_TITLE=${{ inputs.upstream_tag }}"
              echo "RELEASE_NOTES=Built from upstream release: https://gitlab.com/bighead.0/ladxhd_updated/-/releases/${{ inputs.upstream_tag }}"
              echo "IS_NIGHTLY=false"
            } >> "$GITHUB_ENV"
          else
            echo "RELEASE_SUFFIX=build-${{ github.run_id }}" >> "$GITHUB_ENV"
          fi

      - name: Generate xdelta3 patches
        shell: bash
        run: |
          scripts/generate-xdelta-patches.sh v1.zip "$RELEASE_SUFFIX" \
            windows-dx11 windows-dx12 windows-gl windows-vk \
            linux-x64-gl-standalone linux-arm64-gl-standalone linux-x64-vk-standalone linux-arm64-vk-standalone \
            linux-x64-gl-appimage linux-arm64-gl-appimage linux-x64-vk-appimage linux-arm64-vk-appimage \
            macos-arm64-gl-game macos-x64-gl-game \
            macos-arm64-gl-launcher macos-x64-gl-launcher \
            macos-arm64-vk-game macos-x64-vk-game \
            macos-arm64-vk-launcher macos-x64-vk-launcher \
            android

      - name: Create GitHub release
        if: github.event_name == 'schedule' || inputs.trigger == 'nightly' || inputs.trigger == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$IS_NIGHTLY" = "true" ]; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          fi
          PRERELEASE_FLAGS=()
          [ "$IS_NIGHTLY" = "true" ] && PRERELEASE_FLAGS+=(--prerelease)
          ASSETS=()
          for key in windows-dx11 windows-dx12 windows-gl windows-vk \
                     linux-x64-gl-standalone linux-arm64-gl-standalone linux-x64-vk-standalone linux-arm64-vk-standalone \
                     linux-x64-gl-appimage linux-arm64-gl-appimage linux-x64-vk-appimage linux-arm64-vk-appimage \
                     macos-arm64-gl-game macos-x64-gl-game \
                     macos-arm64-gl-launcher macos-x64-gl-launcher \
                     macos-arm64-vk-game macos-x64-vk-game \
                     macos-arm64-vk-launcher macos-x64-vk-launcher \
                     android; do
            ASSETS+=("${key}-${RELEASE_SUFFIX}.xdelta")
          done
          gh release create "$RELEASE_TAG" \
            "${PRERELEASE_FLAGS[@]}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            "${ASSETS[@]}"

      - name: Upload xdelta - windows-dx11
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: windows-dx11-build-${{ github.run_id }}
          path: windows-dx11-*.xdelta
          archive: false

      - name: Upload xdelta - windows-gl
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: windows-gl-build-${{ github.run_id }}
          path: windows-gl-*.xdelta
          archive: false

      - name: Upload xdelta - windows-dx12
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: windows-dx12-build-${{ github.run_id }}
          path: windows-dx12-*.xdelta
          archive: false

      - name: Upload xdelta - windows-vk
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: windows-vk-build-${{ github.run_id }}
          path: windows-vk-*.xdelta
          archive: false

      - name: Upload xdelta - linux-x64-gl
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-gl-build-${{ github.run_id }}
          path: linux-x64-gl-standalone-*.xdelta
          archive: false

      - name: Upload xdelta - linux-arm64-gl
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-gl-build-${{ github.run_id }}
          path: linux-arm64-gl-standalone-*.xdelta
          archive: false

      - name: Upload xdelta - linux-x64-vk
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-vk-build-${{ github.run_id }}
          path: linux-x64-vk-standalone-*.xdelta
          archive: false

      - name: Upload xdelta - linux-arm64-vk
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-vk-build-${{ github.run_id }}
          path: linux-arm64-vk-standalone-*.xdelta
          archive: false

      - name: Upload xdelta - linux-x64-gl-appimage
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-gl-appimage-build-${{ github.run_id }}
          path: linux-x64-gl-appimage-*.xdelta
          archive: false

      - name: Upload xdelta - linux-arm64-gl-appimage
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-gl-appimage-build-${{ github.run_id }}
          path: linux-arm64-gl-appimage-*.xdelta
          archive: false

      - name: Upload xdelta - linux-x64-vk-appimage
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-vk-appimage-build-${{ github.run_id }}
          path: linux-x64-vk-appimage-*.xdelta
          archive: false

      - name: Upload xdelta - linux-arm64-vk-appimage
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-vk-appimage-build-${{ github.run_id }}
          path: linux-arm64-vk-appimage-*.xdelta
          archive: false

      - name: Upload xdelta - macos-arm64-gl-game
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-gl-game-build-${{ github.run_id }}
          path: macos-arm64-gl-game-*.xdelta
          archive: false

      - name: Upload xdelta - macos-arm64-gl-launcher
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-gl-launcher-build-${{ github.run_id }}
          path: macos-arm64-gl-launcher-*.xdelta
          archive: false

      - name: Upload xdelta - macos-x64-gl-game
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-gl-game-build-${{ github.run_id }}
          path: macos-x64-gl-game-*.xdelta
          archive: false

      - name: Upload xdelta - macos-x64-gl-launcher
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-gl-launcher-build-${{ github.run_id }}
          path: macos-x64-gl-launcher-*.xdelta
          archive: false

      - name: Upload xdelta - macos-arm64-vk-game
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-vk-game-build-${{ github.run_id }}
          path: macos-arm64-vk-game-*.xdelta
          archive: false

      - name: Upload xdelta - macos-arm64-vk-launcher
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-vk-launcher-build-${{ github.run_id }}
          path: macos-arm64-vk-launcher-*.xdelta
          archive: false

      - name: Upload xdelta - macos-x64-vk-game
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-vk-game-build-${{ github.run_id }}
          path: macos-x64-vk-game-*.xdelta
          archive: false

      - name: Upload xdelta - macos-x64-vk-launcher
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-vk-launcher-build-${{ github.run_id }}
          path: macos-x64-vk-launcher-*.xdelta
          archive: false

      - name: Upload xdelta - android
        if: github.event_name == 'workflow_dispatch' && inputs.trigger == 'manual'
        uses: actions/upload-artifact@v7
        with:
          name: android-build-${{ github.run_id }}
          path: android-*.xdelta
          archive: false

      - name: Clean up R2 artifacts
        shell: bash
        run: aws s3 rm "s3://${R2_BUCKET}/${RUN_ID}/" --recursive

  cleanup-caches:
    needs:
      - game
      - launcher
      - finalize-windows
      - finalize-linux-standalone
      - finalize-linux-appimage
      - finalize-macos
      - finalize-android
      - generate-patches
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old caches (keep last 4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list \
            --repo ${{ github.repository }} \
            --limit 1000 \
            --json key,lastAccessedAt \
            --jq '. | sort_by(.lastAccessedAt) | reverse | .[4:] | .[].key' | \
          while IFS= read -r key; do
            [ -n "$key" ] && gh cache delete "$key" --repo ${{ github.repository }} || true
          done
